[project]
name = "topic-explorer-dashboard"
version = "1.0.0"
description = "An interactive Plotly Dash explorer for news topics found by the Headline Radar topic model."
readme = "README.md"
authors = [{ name = "Alex Geiger" }]
requires-python = ">=3.11"
dependencies = [
    "dash>=4.0",
    "dash-cytoscape>=1.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "plotly>=6.0",
    "pyarrow>=15.0",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "gunicorn>=23.0",
    # The httpx only client for the Ask page. For local work: pip install -e ../rag-chatbot
    "rag-chatbot @ git+https://github.com/ajgeiger/rag-chatbot.git",
]

[project.optional-dependencies]
# Needed only by build_cache.py to read the pickled topic model.
build = ["joblib>=1.4", "umap-learn>=0.5", "hdbscan>=0.8"]
dev = ["pytest>=8.0", "ruff>=0.6", "playwright>=1.45"]

[tool.setuptools]
packages = [
    "analytics", "analytics.forecast", "components", "components.forecast", "config", "data", "data.forecast", "pages",
    "portfolio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The dash.testing plugin is not used here and emits a pytest deprecation warning.
addopts = "-p no:dash"
pythonpath = ["."]
# pandas raises this numpy warning internally for Timedelta comparisons; it is not from this code.
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["cache", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N"]
ignore = ["N999"]
